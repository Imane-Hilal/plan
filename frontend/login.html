<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestionRH - Connexion</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-users"></i>
                    <h1>GestionRH</h1>
                </div>
                <p>Système de Gestion des Ressources Humaines</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email
                    </label>
                    <input type="email" id="email" name="email" required placeholder="votre@email.com">
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Mot de passe
                    </label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i>
                    Se connecter
                </button>
            </form>
            
            <div class="test-accounts">
                <h3><i class="fas fa-info-circle"></i> Comptes de test</h3>
                <div class="account-card">
                    <strong>👑 Administrateur</strong>
                    <p>Email: admin@gestionrh.com</p>
                    <p>Mot de passe: password123</p>
                </div>
                <div class="account-card">
                    <strong>👤 Collaborateur</strong>
                    <p>Email: jean.dupont@gestionrh.com</p>
                    <p>Mot de passe: password123</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Notification -->
    <div id="notification" class="notification"></div>
    
    <script src="auth.js"></script>
</body>
</html>
